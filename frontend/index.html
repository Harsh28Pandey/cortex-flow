<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom AI</title>

    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <!-- tailwind css cdn link -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-neutral-900 text-white overflow-x-hidden">
    <div class="container mx-auto max-w-3xl px-4 py-8 mb-44">
      <!-- messages goes here -->

      <!-- user message -->
      <div class="my-6 bg-neutral-800 p-3 rounded-2xl ml-auto max-w-fit">
        Hi, how are you?
      </div>

      <!-- assistant message -->
      <div class="my-6 bg-neutral-800 p-3 rounded-2xl mr-auto max-w-fit">
        I'm good, thank you! How can I assist you today?
      </div>

      <!-- bottom textarea goes here -->

      <div
        class="fixed inset-x-0 bottom-0 flex items-center justify-center bg-neutral-900"
      >
        <div class="bg-neutral-800 p-2 rounded-3xl w-full max-w-3xl mb-3">
          <textarea
            class="w-full bg-neutral-800 text-white resize-none outline-0 p-3"
            rows="2"
            id="input"
            placeholder="Type your message here..."
          ></textarea>
          <div class="flex items-center justify-end">
            <button
              class="bg-white px-4 py-1 text-black rounded-full cursor-pointer hover:bg-gray-300"
            >
              Ask
            </button>
          </div>
        </div>
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
